[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lostpart"
version = "0.1.0"
description = "Identify and recover lost partitions on Windows and Linux disks (clean-room implementation)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Atamis Filho" }]
keywords = ["partition", "recovery", "mbr", "gpt", "ntfs", "forensics", "disk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Recovery Tools",
]

[project.scripts]
lostpart = "lostpart.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lostpart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
